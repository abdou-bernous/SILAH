services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: silah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-key-not-for-production-use-only}
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      DATABASE_URL: postgres://postgres:postgres@db:5432/silah
      MEDIA_ROOT: /app/media
      SEED_DEMO: "1"
    volumes:
      - media:/app/media
    ports:
      - "8100:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:3000"

volumes:
  pgdata:
  media:
